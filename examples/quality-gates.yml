# Referência não instalada. Preencher antes de adotar no repositório.
name: Quality gates reference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FEATURE_DIR: ''
      STAGE_RECORD: ''
    steps:
      - uses: actions/checkout@v4 # Recomendado: pinar por commit SHA no projeto alvo
      - uses: actions/setup-python@v5 # Recomendado: pinar por commit SHA no projeto alvo
        with:
          python-version: '3.12'
      - name: Require project configuration
        shell: bash
        run: |
          test -n "$FEATURE_DIR"
          test -n "$STAGE_RECORD"
          test -f .specify/presets/cemg-speckit-preset/tools/check_gate.py
      - name: Run project tests
        # Substituir pelo comando literal de testes do projeto (evitar bash -c "$VAR").
        shell: bash
        run: |
          echo "Configure o comando literal de testes do projeto antes de ativar este workflow." >&2
          exit 1
      - name: Verify recorded planning conditions for actual checkout
        shell: bash
        run: |
          REVISION=$(git rev-parse HEAD)
          python .specify/presets/cemg-speckit-preset/tools/check_gate.py --feature "$FEATURE_DIR" --record "$STAGE_RECORD" --stage tasks --revision "$REVISION"
      # A resolução ativa e aprovação humana exigem configuração adicional:
      # instalar specify >=1.1.3 e usar --project, habilitar evento pull_request
      # após revisão, e exigir estes checks + aprovação na proteção da branch.
